<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" fill="none">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="fullLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="55%" stop-color="#0e2340"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Luxury Gold Accent Gradient -->
    <linearGradient id="fullLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Sky Horizon Arc Gradient -->
    <linearGradient id="fullLogoArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="fullLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (48x48) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="48" height="48" rx="13" fill="url(#fullLogoBg)"/>
    <rect x="0.5" y="0.5" width="47" height="47" rx="12.5" stroke="url(#fullLogoGold)" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Globe Grid Arcs -->
    <g stroke="#94a3b8" stroke-width="0.9" stroke-opacity="0.35" fill="none">
      <circle cx="24" cy="24" r="15"/>
      <ellipse cx="24" cy="24" rx="15" ry="6"/>
      <ellipse cx="24" cy="24" rx="6" ry="15"/>
    </g>

    <!-- Horizon Arc -->
    <path d="M9 34 C 12 20, 23 12, 36 13.5" stroke="url(#fullLogoArc)" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#fullLogoGlow)"/>

    <!-- Jet -->
    <g transform="translate(36, 13.5) rotate(42) scale(0.8)" fill="url(#fullLogoGold)">
      <path d="M0 -7 L3 0 L9 3 L3 4 L3.5 7 L1 6.5 L0 8 L-1 6.5 L-3.5 7 L-3 4 L-9 3 L-3 0 Z"/>
    </g>

    <!-- Compass Star -->
    <g transform="translate(16, 16)" fill="url(#fullLogoGold)">
      <path d="M0 -5 Q 0.5 -1, 4.5 0 Q 0.5 1, 0 5 Q -0.5 1, -4.5 0 Q -0.5 -1, 0 -5 Z"/>
      <circle cx="0" cy="0" r="0.9" fill="#ffffff"/>
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(68, 0)">
    <!-- Script "travel" -->
    <text x="0" y="38" font-family="'Caveat', cursive, sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="-0.5">travel</text>
    <!-- Subtitle "THE WORLD" -->
    <text x="2" y="52" font-family="'Plus Jakarta Sans', 'Syne', sans-serif" font-size="9" font-weight="800" fill="#38bdf8" letter-spacing="3.5">THE WORLD</text>
  </g>
</svg>
