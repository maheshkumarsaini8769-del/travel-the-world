<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="55%" stop-color="#0e2340"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="favArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)"/>
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="url(#favGold)" stroke-width="1.8" stroke-opacity="0.85"/>

  <!-- Globe Circles -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.4" fill="none">
    <circle cx="32" cy="32" r="19"/>
    <ellipse cx="32" cy="32" rx="19" ry="7.5"/>
    <ellipse cx="32" cy="32" rx="7.5" ry="19"/>
  </g>

  <!-- Flight Trail -->
  <path d="M13 46 C 17 28, 31 17, 47 19" stroke="url(#favArc)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Airplane -->
  <g transform="translate(47, 19) rotate(42) scale(1.15)" fill="url(#favGold)">
    <path d="M0 -7 L3 0 L9 3 L3 4 L3.5 7 L1 6.5 L0 8 L-1 6.5 L-3.5 7 L-3 4 L-9 3 L-3 0 Z"/>
  </g>

  <!-- Compass Star -->
  <g transform="translate(22, 22)" fill="url(#favGold)">
    <path d="M0 -7 Q 0.7 -1.5, 6.5 0 Q 0.7 1.5, 0 7 Q -0.7 1.5, -6.5 0 Q -0.7 -1.5, 0 -7 Z"/>
    <circle cx="0" cy="0" r="1.3" fill="#ffffff"/>
  </g>
</svg>
